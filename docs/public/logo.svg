<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="coc-golang: the Go gopher biting the coc.nvim fruit">
  <title>coc-golang</title>
  <!-- Gopher style based on the Go mascot by Renée French (CC BY 3.0); fruit redrawn from the coc.nvim logo (MIT). -->
  <defs>
    <mask id="bite" maskUnits="userSpaceOnUse" x="380" y="0" width="520" height="480">
      <rect x="380" y="0" width="520" height="480" fill="#fff"/>
      <g fill="#000">
        <circle cx="596" cy="98" r="44"/>
        <circle cx="640" cy="104" r="44"/>
        <circle cx="686" cy="116" r="44"/>
        <circle cx="620" cy="58" r="44"/>
        <circle cx="668" cy="72" r="44"/>
      </g>
    </mask>
  </defs>

  <ellipse cx="200" cy="372" rx="120" ry="14" fill="#000" opacity=".08"/>

  <!-- gopher -->
  <g>
    <ellipse cx="148" cy="360" rx="34" ry="15" fill="#5CC6D6"/>
    <ellipse cx="252" cy="360" rx="34" ry="15" fill="#5CC6D6"/>
    <circle cx="112" cy="96" r="26" fill="#6AD7E5"/>
    <circle cx="288" cy="96" r="26" fill="#6AD7E5"/>
    <circle cx="112" cy="96" r="12" fill="#F6D2A2"/>
    <circle cx="288" cy="96" r="12" fill="#F6D2A2"/>
    <ellipse cx="200" cy="220" rx="115" ry="140" fill="#6AD7E5"/>
    <ellipse cx="200" cy="196" rx="46" ry="32" fill="#F6D2A2"/>
    <ellipse cx="200" cy="180" rx="13" ry="9" fill="#2D2A2E"/>
    <circle cx="158" cy="146" r="31" fill="#fff"/>
    <circle cx="242" cy="146" r="31" fill="#fff"/>
    <circle cx="167" cy="156" r="10" fill="#2D2A2E"/>
    <circle cx="233" cy="156" r="10" fill="#2D2A2E"/>
    <circle cx="170" cy="152" r="3.5" fill="#fff"/>
    <circle cx="236" cy="152" r="3.5" fill="#fff"/>
  </g>

  <!-- coc.nvim fruit with a bite taken out -->
  <g transform="translate(200 205) scale(.5) translate(-640 -110)" mask="url(#bite)" stroke-linejoin="round">
    <path d="M420 282 L452 276 L735 190 L768 160 L862 145 L868 148 L700 318 C640 370 570 410 495 425 C440 420 400 360 420 282 Z" fill="#53A240"/>
    <path d="M868 148 C876 200 870 260 860 302 C830 322 760 336 700 318 Z" fill="#53A240" stroke="#fff" stroke-width="12"/>
    <path d="M795 232 C840 240 860 270 860 302 C830 322 760 336 700 318 Z" fill="#458B36"/>
    <path d="M478 178 C486 100 540 55 600 57 C675 60 735 110 762 158 L732 182 C700 135 650 100 575 105 C520 112 490 150 478 178 Z" fill="#3A90D8"/>
    <path d="M463 272 C470 160 520 105 580 105 C650 105 710 150 735 190 C710 270 610 335 523 367 C478 355 458 320 463 272 Z" fill="#53A240" stroke="#fff" stroke-width="14"/>
  </g>

  <!-- buck teeth -->
  <g fill="#fff" stroke="#E6E1D8" stroke-width="2">
    <rect x="187" y="208" width="12.500" height="20" rx="3"/>
    <rect x="201.500" y="208" width="12.500" height="20" rx="3"/>
  </g>

  <!-- paws holding the fruit -->
  <g fill="#6AD7E5" stroke="#4FB7C9" stroke-width="4">
    <ellipse cx="104" cy="292" rx="22" ry="27"/>
    <ellipse cx="296" cy="292" rx="22" ry="27"/>
  </g>
</svg>
